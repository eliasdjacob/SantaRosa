<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="/mate.png" type="image/x-icon" />
    <title>Instituto Santa Rosa</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="contacto.css" />
</head>

<body>

    <header>
        <h1>Instituto Santa Rosa</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="preferencias.html">Características</a></li>
                <li><a href="audiovisuales.html">Audiovisuales</a></li>
                <li><a class="active" href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <div class="contenedor-formulario">
        <form>
            <label for="nombre">Nombre: </label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribí acá tu nombre" required minlength="3" />

            <label for="apellido">Apellido: </label>
            <input type="text" id="apellido" name="apellido" placeholder="Escribí acá tu apellido" required minlength="3" />

            <label for="mail">Email: </label>
            <input type="email" id="mail" name="mail" placeholder="Escribí acá tu email" required />

            <label for="pais">País: </label>
            <select name="pais" id="pais">
                <option value="Argentina">Argentina</option>
                <option value="Chile">Chile</option>
                <option value="Bolivia">Bolivia</option>
                <option value="Perú">Perú</option>
                <option value="Uruguay">Uruguay</option>
                <option value="España">España</option>
                <option value="Colombia">Colombia</option>
                <option value="Venezuela">Venezuela</option>
                <option value="Paraguay">Paraguay</option>
                <option value="Ecuador">Ecuador</option>
            </select>

            <label for="comentario">Comentario: </label>
            <textarea name="comentario" id="comentario" placeholder="Escribí acá tu comentario"></textarea>

            <label>Motivo de contacto:</label><br />
            <label><input type="radio" name="motivo" value="Carreras presenciales" /> Carreras presenciales</label><br />
            <label><input type="radio" name="motivo" value="Carreras a distancia" /> Carreras a distancia</label><br />
            <label><input type="radio" name="motivo" value="Sugerencias" /> Sugerencias</label><br />
            <label><input type="radio" name="motivo" value="Reclamos" /> Reclamos</label><br />

            <input type="submit" value="Enviar" />
        </form>
    </div>

    <footer class="footer">
        <p>Derechos reservados &copy; 2025</p>
    </footer>

</body>

</html>
